<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理後台 | MC組事務所</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0b0b10;
      color: #ddd;
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      min-height: 100vh;
    }

    /* ── 登入畫面 ── */
    #login-view {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-card {
      background: #13131c;
      border: 1px solid #222230;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
    }
    .login-card h1 { font-size: 20px; color: #fff; margin-bottom: 6px; }
    .login-card p  { font-size: 13px; color: #666; margin-bottom: 28px; }
    .lf-field { margin-bottom: 16px; }
    .lf-label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; }
    .lf-input {
      width: 100%;
      background: #0b0b10;
      border: 1px solid #222;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 14px;
      padding: 10px 13px;
      font-family: inherit;
    }
    .lf-input:focus { outline: none; border-color: #444; }
    .lf-btn {
      width: 100%;
      padding: 12px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      margin-top: 6px;
    }
    .lf-btn:hover { background: #4338ca; }
    .lf-btn:disabled { background: #1c1c28; color: #555; cursor: not-allowed; }
    .lf-err { color: #f87171; font-size: 13px; margin-top: 10px; text-align: center; min-height: 20px; }

    /* ── 後台畫面 ── */
    #admin-view { display: none; }

    .ad-header {
      background: #111118;
      border-bottom: 1px solid #1e1e2a;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .ad-header-left { display: flex; align-items: center; gap: 12px; }
    .ad-logo { font-size: 18px; font-weight: 700; color: #fff; }
    .ad-badge {
      background: #1c1c2e;
      color: #888;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #2a2a3a;
    }
    .ad-logout {
      background: none;
      border: 1px solid #2a2a3a;
      color: #888;
      padding: 6px 14px;
      border-radius: 7px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: all .2s;
    }
    .ad-logout:hover { border-color: #555; color: #ccc; }

    .ad-body { max-width: 820px; margin: 0 auto; padding: 32px 20px; }

    /* 統計卡片 */
    .ad-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: #13131c;
      border: 1px solid #1e1e2a;
      border-radius: 10px;
      padding: 16px 20px;
    }
    .stat-num { font-size: 28px; font-weight: 700; color: #fff; }
    .stat-lbl { font-size: 12px; color: #666; margin-top: 2px; }

    /* 篩選 tabs */
    .ad-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
    }
    .ad-tab {
      padding: 7px 18px;
      border-radius: 8px;
      border: 1px solid #222230;
      background: none;
      color: #888;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: all .2s;
    }
    .ad-tab:hover { background: #1a1a25; color: #ccc; }
    .ad-tab.active {
      background: #1e1e2e;
      color: #a5b4fc;
      border-color: #3b3b5a;
    }

    /* 回報卡片 */
    .fb-list { display: flex; flex-direction: column; gap: 14px; }

    .fb-item {
      background: #13131c;
      border: 1px solid #1e1e2a;
      border-radius: 12px;
      padding: 20px 22px;
      transition: border-color .2s;
    }
    .fb-item.resolved { opacity: .55; }
    .fb-item:hover { border-color: #2c2c40; }

    .fb-item-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .type-badge {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 5px;
      font-weight: 500;
    }
    .type-bug     { background: #2d1515; color: #f87171; }
    .type-data    { background: #2d1e10; color: #fb923c; }
    .type-suggest { background: #13213a; color: #60a5fa; }
    .type-other   { background: #1c1c1c; color: #9ca3af; }

    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .status-open     { background: #1a2a1a; color: #4ade80; border: 1px solid #2a4a2a; }
    .status-resolved { background: #1a1a2a; color: #6b7280; border: 1px solid #2a2a3a; }

    .fb-date { font-size: 12px; color: #555; margin-left: auto; }

    .fb-content {
      font-size: 14px;
      color: #ccc;
      line-height: 1.65;
      margin-bottom: 10px;
      white-space: pre-wrap;
    }
    .fb-contact {
      font-size: 12px;
      color: #666;
      margin-bottom: 14px;
    }
    .fb-contact span { color: #888; }

    /* 回覆區 */
    .fb-reply-area { margin-top: 14px; border-top: 1px solid #1e1e2a; padding-top: 14px; }
    .fb-reply-label { font-size: 12px; color: #666; margin-bottom: 8px; }
    .fb-reply-txt {
      font-size: 13px;
      color: #aaa;
      background: #0b0b10;
      border: 1px solid #1e1e2a;
      border-radius: 7px;
      padding: 9px 12px;
      white-space: pre-wrap;
      line-height: 1.6;
    }
    .fb-reply-input {
      width: 100%;
      background: #0b0b10;
      border: 1px solid #222;
      border-radius: 7px;
      color: #e0e0e0;
      font-size: 13px;
      padding: 9px 12px;
      font-family: inherit;
      resize: vertical;
      min-height: 80px;
      line-height: 1.6;
    }
    .fb-reply-input:focus { outline: none; border-color: #444; }

    .fb-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .btn-save {
      padding: 7px 16px;
      background: #1e3a5f;
      color: #7dd3fc;
      border: 1px solid #2a4a6a;
      border-radius: 7px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: background .2s;
    }
    .btn-save:hover { background: #254a75; }
    .btn-resolve {
      padding: 7px 16px;
      background: #14532d;
      color: #4ade80;
      border: 1px solid #1e6b3a;
      border-radius: 7px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: background .2s;
    }
    .btn-resolve:hover { background: #166534; }
    .btn-reopen {
      padding: 7px 16px;
      background: #1c1c28;
      color: #888;
      border: 1px solid #2a2a3a;
      border-radius: 7px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: background .2s;
    }
    .btn-reopen:hover { background: #252535; }
    .btn-edit {
      padding: 7px 16px;
      background: #1c1c28;
      color: #aaa;
      border: 1px solid #2a2a3a;
      border-radius: 7px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: background .2s;
    }
    .btn-edit:hover { background: #252535; }
    .btn-delete {
      padding: 7px 16px;
      background: #2d1515;
      color: #f87171;
      border: 1px solid #4a1f1f;
      border-radius: 7px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: background .2s;
      margin-left: auto;
    }
    .btn-delete:hover { background: #3d1c1c; }

    .empty-msg {
      text-align: center;
      padding: 60px 0;
      color: #555;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .ad-stats { grid-template-columns: repeat(3, 1fr); }
      .stat-num { font-size: 22px; }
      .ad-body { padding: 20px 14px; }
    }
  </style>
</head>
<body>

  <!-- ── 登入畫面 ── -->
  <div id="login-view">
    <div class="login-card">
      <h1>🔧 管理後台</h1>
      <p>MC組事務所 · 問題回報管理</p>
      <div class="lf-field">
        <label class="lf-label">密碼</label>
        <input class="lf-input" type="password" id="lf-password" placeholder="••••••••" autocomplete="current-password"
          onkeydown="if(event.key==='Enter') login()">
      </div>
      <button class="lf-btn" id="lf-btn" onclick="login()">登入</button>
      <div class="lf-err" id="lf-err"></div>
    </div>
  </div>

  <!-- ── 後台畫面 ── -->
  <div id="admin-view">
    <header class="ad-header">
      <div class="ad-header-left">
        <span class="ad-logo">🐸 MC組事務所</span>
        <span class="ad-badge">管理後台</span>
      </div>
      <button class="ad-logout" onclick="logout()">登出</button>
    </header>

    <main class="ad-body">
      <!-- 統計 -->
      <div class="ad-stats">
        <div class="stat-card">
          <div class="stat-num" id="stat-total">–</div>
          <div class="stat-lbl">全部回報</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-open" style="color:#4ade80">–</div>
          <div class="stat-lbl">待處理</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-done" style="color:#6b7280">–</div>
          <div class="stat-lbl">已解決</div>
        </div>
      </div>

      <!-- 篩選 -->
      <div class="ad-tabs">
        <button class="ad-tab active" onclick="setFilter('all',this)">全部</button>
        <button class="ad-tab" onclick="setFilter('open',this)">待處理</button>
        <button class="ad-tab" onclick="setFilter('resolved',this)">已解決</button>
      </div>

      <!-- 清單 -->
      <div class="fb-list" id="fb-list">
        <div class="empty-msg">載入中…</div>
      </div>
    </main>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7LEEufgBX3dItTeAIz1o5PIGX-GzdpdZ4Q_EqMOxw4rfZYo1bIMjQbLwPxUiQ3ny-/exec';
    const ADMIN_HASH = '67445936719bc62c27d88b3e418174571f363f347082370ce8e38d6e5894e5d3';

    let allFeedback   = [];
    let currentFilter = 'all';

    async function hashPwd(pwd) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pwd));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    (function() {
      if (sessionStorage.getItem('mc-admin') === '1') showAdmin();
    })();

    async function login() {
      const password = document.getElementById('lf-password').value;
      const btn      = document.getElementById('lf-btn');
      const errEl    = document.getElementById('lf-err');
      errEl.textContent = '';
      btn.disabled      = true;
      btn.textContent   = '驗證中…';
      const hash = await hashPwd(password);
      if (hash === ADMIN_HASH) {
        sessionStorage.setItem('mc-admin', '1');
        showAdmin();
      } else {
        errEl.textContent = '密碼錯誤';
        btn.disabled      = false;
        btn.textContent   = '登入';
      }
    }

    function logout() {
      sessionStorage.removeItem('mc-admin');
      document.getElementById('admin-view').style.display = 'none';
      document.getElementById('login-view').style.display = 'flex';
      allFeedback = [];
    }

    function showAdmin() {
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('admin-view').style.display = 'block';
      loadFeedback();
    }

    async function loadFeedback() {
      try {
        const res  = await fetch(SCRIPT_URL + '?action=read');
        const data = await res.json();
        allFeedback = data.data || [];
        updateStats();
        renderList();
      } catch(e) {
        document.getElementById('fb-list').innerHTML =
          '<div class="empty-msg">載入失敗：' + e.message + '</div>';
      }
    }

    function updateStats() {
      const open     = allFeedback.filter(f => f.status === 'open').length;
      const resolved = allFeedback.filter(f => f.status === 'resolved').length;
      document.getElementById('stat-total').textContent = allFeedback.length;
      document.getElementById('stat-open').textContent  = open;
      document.getElementById('stat-done').textContent  = resolved;
    }

    function setFilter(f, el) {
      currentFilter = f;
      document.querySelectorAll('.ad-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      renderList();
    }

    function renderList() {
      const list  = document.getElementById('fb-list');
      const items = currentFilter === 'all'
        ? allFeedback
        : allFeedback.filter(f => f.status === currentFilter);
      if (!items.length) {
        list.innerHTML = '<div class="empty-msg">沒有符合條件的回報 🎉</div>';
        return;
      }
      list.innerHTML = items.map(f => itemHTML(f)).join('');
    }

    const typeMap = {
      bug:     { cls: 'type-bug',     label: '🐛 網站 Bug'  },
      data:    { cls: 'type-data',    label: '📝 資料錯誤'  },
      suggest: { cls: 'type-suggest', label: '💡 功能建議'  },
      other:   { cls: 'type-other',   label: '💬 其他'      },
    };

    function fmtDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit' })
           + ' ' + d.toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' });
    }

    function itemHTML(f) {
      const t    = typeMap[f.type] || typeMap.other;
      const done = f.status === 'resolved';
      const replySection = done && f.reply
        ? `<div class="fb-reply-area">
             <div class="fb-reply-label">回覆內容</div>
             <div class="fb-reply-txt">${esc(f.reply)}</div>
           </div>`
        : `<div class="fb-reply-area">
             <div class="fb-reply-label">回覆 / 備註</div>
             <textarea class="fb-reply-input" id="reply-${f.id}" placeholder="輸入回覆或內部備註…">${esc(f.reply || '')}</textarea>
           </div>`;
      const actionBtns = done
        ? `<button class="btn-edit"   onclick="editItem('${f.id}')">編輯回覆</button>
           <button class="btn-reopen" onclick="setStatus('${f.id}','open')">重新開啟</button>
           <button class="btn-delete" onclick="deleteItem('${f.id}')">🗑 刪除</button>`
        : `<button class="btn-save"    onclick="saveReply('${f.id}')">儲存回覆</button>
           <button class="btn-resolve" onclick="resolve('${f.id}')">✓ 標記解決</button>
           <button class="btn-delete"  onclick="deleteItem('${f.id}')">🗑 刪除</button>`;
      return `
      <div class="fb-item${done ? ' resolved' : ''}" id="item-${f.id}">
        <div class="fb-item-top">
          <span class="type-badge ${t.cls}">${t.label}</span>
          <span class="status-badge ${done ? 'status-resolved' : 'status-open'}">${done ? '已解決' : '待處理'}</span>
          <span class="fb-date">${fmtDate(f.created_at)}</span>
        </div>
        <div class="fb-content">${esc(f.content)}</div>
        ${replySection}
        <div class="fb-actions">${actionBtns}</div>
      </div>`;
    }

    function editItem(id) {
      const f = allFeedback.find(x => x.id === id);
      if (!f) return;
      const item = document.getElementById('item-' + id);
      item.querySelector('.fb-reply-area').innerHTML = `
        <div class="fb-reply-label">回覆 / 備註</div>
        <textarea class="fb-reply-input" id="reply-${id}" placeholder="輸入回覆或內部備註…">${esc(f.reply || '')}</textarea>`;
      item.querySelector('.fb-actions').innerHTML = `
        <button class="btn-save"    onclick="saveReply('${id}')">儲存回覆</button>
        <button class="btn-resolve" onclick="resolve('${id}')">✓ 標記解決</button>`;
    }

    async function saveReply(id) {
      const txt    = document.getElementById('reply-' + id)?.value || '';
      const params = new URLSearchParams({ action: 'update', id, reply: txt });
      await fetch(SCRIPT_URL + '?' + params);
      const f = allFeedback.find(x => x.id === id);
      if (f) f.reply = txt;
      alert('已儲存');
    }

    async function resolve(id) {
      const txt    = document.getElementById('reply-' + id)?.value || '';
      const params = new URLSearchParams({ action: 'update', id, status: 'resolved', reply: txt });
      await fetch(SCRIPT_URL + '?' + params);
      const f = allFeedback.find(x => x.id === id);
      if (f) { f.status = 'resolved'; f.reply = txt; }
      updateStats();
      renderList();
    }

    async function setStatus(id, status) {
      const params = new URLSearchParams({ action: 'update', id, status });
      await fetch(SCRIPT_URL + '?' + params);
      const f = allFeedback.find(x => x.id === id);
      if (f) f.status = status;
      updateStats();
      renderList();
    }

    async function deleteItem(id) {
      if (!confirm('確定要永久刪除這筆回報嗎？此操作無法復原。')) return;
      const params = new URLSearchParams({ action: 'delete', id });
      await fetch(SCRIPT_URL + '?' + params);
      allFeedback = allFeedback.filter(x => x.id !== id);
      updateStats();
      renderList();
    }

    function esc(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>

</body>
</html>
