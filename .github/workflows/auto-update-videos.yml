name: 🎵 Auto-Update VTuber Videos

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 🎯 Run auto-update script
        run: |
          node - <<'SCRIPT'
          const fs = require('fs');
          const https = require('https');

          const dataPath = './js/data.js';
          let dataContent = '';
          
          try {
            dataContent = fs.readFileSync(dataPath, 'utf8');
          } catch (e) {
            console.log('❌ 讀取 data.js 失敗');
            process.exit(1);
          }

          const apiKeyMatch = dataContent.match(/ytApiKey:\s*["']([^"']+)["']/);
          const API_KEY = apiKeyMatch ? apiKeyMatch[1] : null;

          if (!API_KEY) {
            console.log('❌ 無 API 金鑰');
            process.exit(1);
          }

          const now = new Date();
          const hourOfDay = now.getUTCHours();
          const segmentIndex = 0; // 🔴 強制時段1（手動更新）

          const segments = [
            { ids: ['shiucoda', 'rumi', 'paroniie', 'lubee', 'himegimichika', 'arrynia', 'kiriko'], name: '時段1' },
            { ids: ['vaswawa', 'sinniearis', 'ririna', 'ekorru', 'wakasaito', 'whalefall', 'kai'], name: '時段2' },
            { ids: ['mukuru', 'nyrfier', 'shiroleon', 'fuka22', 'BarkBarkPomi', 'cocor0', 'UchiFifi'], name: '時段3' },
            { ids: ['chita', 'nokori', 'KeKeMii', 'chamamatti', 'Pele', 'Yawnii'], name: '時段4' }
          ];

          const vtuberIds = segments[segmentIndex].ids;
          console.log(`🚀 ${segments[segmentIndex].name} - 掃描 ${vtuberIds.length} 位 VTuber\n`);

          const vtuberData = {};
          vtuberIds.forEach(id => {
            const match = dataContent.match(new RegExp(`id:\s*["']${id}["'][\s\S]*?youtubeChannelId:\s*["']([^"']+)["']`, 'm'));
            if (match) vtuberData[id] = { channelId: match[1] };
          });

          function classifyVideos(vId, items) {
            const covers = [], originals = [], unclassified = [];
            if (!items) return { covers, originals, unclassified };

            items.forEach(item => {
              const title = item.snippet.title;
              const vid = item.snippet.resourceId ? item.snippet.resourceId.videoId : null;
              if (!vid) return;
              if (dataContent.includes(`"${vid}"`) || dataContent.includes(`'${vid}'`)) return; // 已存在
              
              const tL = title.toLowerCase();
              if (tL.includes('直播') || tL.includes('archive') || tL.includes('livestream')) return; // STEP 1
              
              const date = item.snippet.publishedAt.substring(0, 10);
              if (tL.includes('cover') || tL.includes('歌ってみた')) covers.push({ id: vid, title: `【Cover】${title}`, date });
              else if (tL.includes('original') || tL.includes('official') || tL.includes('原創')) originals.push({ id: vid, title: `【Original】${title}`, date });
              else if (vId === 'shiucoda' && (tL.includes('demo') || tL.includes('自彈自唱'))) covers.push({ id: vid, title: `【Cover】${title}`, date });
              else unclassified.push({ id: vid, title, date });
            });
            return { covers, originals, unclassified };
          }

          async function fetchVideos(vId, channelId) {
            return new Promise((resolve) => {
              const uploadsId = 'UU' + channelId.substring(2);
              const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${uploadsId}&maxResults=50&key=${API_KEY}`;
              
              https.get(url, { headers: { 'Referer': 'https://shiukonata.github.io/MCStudio/' } }, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    const result = JSON.parse(data);
                    const videos = classifyVideos(vId, result.items || []);
                    const total = videos.covers.length + videos.originals.length + videos.unclassified.length;
                    console.log(`✅ ${vId}: ${total} 部新影片`);
                    resolve(videos);
                  } catch (e) {
                    console.log(`⚠️ ${vId}: 失敗`);
                    resolve({ covers: [], originals: [], unclassified: [] });
                  }
                });
              }).on('error', () => resolve({ covers: [], originals: [], unclassified: [] }));
            });
          }

          (async () => {
            let total = 0;
            for (const vId of Object.keys(vtuberData)) {
              const v = await fetchVideos(vId, vtuberData[vId].channelId);
              total += v.covers.length + v.originals.length + v.unclassified.length;
              await new Promise(r => setTimeout(r, 300));
            }
            console.log(`\n✅ 掃描完成，發現 ${total} 部新影片（客戶端自動分類）`);
            process.exit(0);
          })();
          SCRIPT

      - name: 📝 Commit
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Auto-Update Bot"
          echo "✅ Workflow 執行完成"

      - name: 📊 Summary
        if: always()
        run: git log --oneline -3
