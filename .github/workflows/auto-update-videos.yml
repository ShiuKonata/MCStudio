name: 🎵 Auto-Update VTuber Videos

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # 每6小時自動執行

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 🎯 Run auto-update script (FIXED)
        run: |
          node - <<'SCRIPT'
          const fs = require('fs');
          const https = require('https');

          const dataPath = './js/data.js';

          // 讀取 data.js
          let dataContent = '';
          try {
            dataContent = fs.readFileSync(dataPath, 'utf8');
          } catch (e) {
            console.log('❌ 讀取 data.js 失敗: ' + e.message);
            process.exit(1);
          }

          // 從 data.js 中提取 API 金鑰
          const apiKeyMatch = dataContent.match(/ytApiKey:\s*["']([^"']+)["']/);
          const API_KEY = apiKeyMatch ? apiKeyMatch[1] : null;

          if (!API_KEY) {
            console.log('❌ 無法從 data.js 中找到 API 金鑰');
            process.exit(1);
          }
          console.log('✅ 已從 data.js 讀取 API 金鑰\n');

          const now = new Date();
          const segmentIndex = Math.floor(now.getUTCHours() / 6);

          let vtuberIds = [];
          let currentSegment = 0;

          const segments = [
            {
              ids: ['shiucoda', 'rumi', 'paroniie', 'lubee', 'himegimichika', 'arrynia', 'kiriko'],
              name: '時段1（一期+零期+二期前）'
            },
            {
              ids: ['vaswawa', 'sinniearis', 'ririna', 'ekorru', 'wakasaito', 'whalefall', 'kai'],
              name: '時段2（二期後+三期前）'
            },
            {
              ids: ['mukuru', 'nyrfier', 'shiroleon', 'fuka22', 'BarkBarkPomi', 'cocor0', 'UchiFifi'],
              name: '時段3（三期後+四期）'
            },
            {
              ids: ['chita', 'nokori', 'KeKeMii', 'chamamatti', 'Pele', 'Yawnii'],
              name: '時段4（五期+六期）'
            }
          ];

          vtuberIds = segments[segmentIndex].ids;
          currentSegment = segmentIndex + 1;

          console.log(`🚀 【每日輪流更新】${segments[segmentIndex].name}`);
          console.log(`   今天更新 ${vtuberIds.length} 位 VTuber\n`);

          const originalContent = dataContent;

          // 從data.js中提取VTuber資訊
          const vtuberData = {};
          vtuberIds.forEach(id => {
            const match = dataContent.match(new RegExp(`id:\\s*["']${id}["'][\\s\\S]*?youtubeChannelId:\\s*["']([^"']+)["']`, 'm'));
            if (match) {
              vtuberData[id] = { channelId: match[1] };
            }
          });

          console.log(`✅ 找到 ${Object.keys(vtuberData).length} 位VTuber的頻道ID\n`);

          // ──【FIXED】──輔助函數：獲取影片詳細信息（duration、isLiveContent 等）──
          function fetchVideoDetails(videoIds) {
            return new Promise((resolve) => {
              if (!videoIds.length) {
                resolve({});
                return;
              }

              const detailMap = {};
              const BATCH_SIZE = 50; // YouTube API 限制 50 個 ID 每次請求

              const options = {
                headers: {
                  'Referer': 'https://shiukonata.github.io/MCStudio/'
                }
              };

              const processNextBatch = (startIdx) => {
                if (startIdx >= videoIds.length) {
                  resolve(detailMap);
                  return;
                }

                const batch = videoIds.slice(startIdx, startIdx + BATCH_SIZE);
                const detailUrl = `https://www.googleapis.com/youtube/v3/videos?part=contentDetails,snippet,liveStreamingDetails&id=${batch.join(',')}&key=${API_KEY}`;

                https.get(detailUrl, options, (res) => {
                  let data = '';
                  res.on('data', chunk => data += chunk);
                  res.on('end', () => {
                    try {
                      const result = JSON.parse(data);
                      if (result.error) {
                        console.log(`  └─ 影片詳情API失敗: ${result.error.message}`);
                        processNextBatch(startIdx + BATCH_SIZE);
                        return;
                      }

                      (result.items || []).forEach(item => {
                        const duration = parseDurationSec(item.contentDetails.duration || 'PT0S');
                        const liveContent = item.snippet.liveBroadcastContent || 'none';
                        const wasLive = !!(item.liveStreamingDetails && item.liveStreamingDetails.actualStartTime);
                        detailMap[item.id] = { duration, liveContent, wasLive };
                      });

                      processNextBatch(startIdx + BATCH_SIZE);
                    } catch (e) {
                      console.log(`  └─ 影片詳情API解析失敗`);
                      processNextBatch(startIdx + BATCH_SIZE);
                    }
                  });
                }).on('error', (e) => {
                  console.log(`  └─ 影片詳情API網路錯誤`);
                  processNextBatch(startIdx + BATCH_SIZE);
                });
              };

              processNextBatch(0);
            });
          }

          function parseDurationSec(dur) {
            const m = dur.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
            if (!m) return 0;
            return (parseInt(m[1]||0)*3600) + (parseInt(m[2]||0)*60) + parseInt(m[3]||0);
          }

          // ──【FIXED】──輔助函數：分類影片（完整五步邏輯）──
          function classifyVideos(vId, items, videoDetails, uushIds = new Set()) {
            const classified = {
              covers: [],
              originals: [],
              officials: [],
              shorts: [],
              unclassified: []
            };
            if (!items) return classified;

            items.forEach(item => {
              const title = item.snippet.title;
              const vid = item.snippet.resourceId ? item.snippet.resourceId.videoId : item.id?.videoId;
              const date = item.snippet.publishedAt ? item.snippet.publishedAt.substring(0, 10) : '';
              if (!vid) return;

              const titleLower = title.toLowerCase();
              const detail = videoDetails[vid] || { duration: 0, liveContent: 'none', wasLive: false };

              // ═══ STEP 1：排除 UULV（直播存檔）和 UUSH（Shorts）═══
              if (detail.liveContent !== 'none' || detail.wasLive) {
                return; // 跳過直播存檔
              }
              if (uushIds.has(vid)) {
                return; // 跳過 Shorts（已由 UUSH 播放列表自動處理）
              }

              // ═══ STEP 2：檢測 Cover / Original / Official ═══
              // 2a. Cover 檢測
              if (titleLower.includes('cover') || titleLower.includes('歌ってみた')) {
                classified.covers.push({
                  id: vid,
                  title: `【Cover】${title}`,
                  date: date
                });
                return;
              }

              // 2b. Original / Official 檢測
              if (titleLower.includes('original') || titleLower.includes('official') || titleLower.includes('原創')) {
                classified.originals.push({
                  id: vid,
                  title: `【Original】${title}`,
                  date: date
                });
                return;
              }

              // ═══ STEP 3：詗雨蔻達特殊規則 ═══
              if (vId === 'shiucoda') {
                // 3a. demo 檢測
                if (titleLower.includes('demo')) {
                  classified.covers.push({
                    id: vid,
                    title: `【Cover】${title}`,
                    date: date
                  });
                  return;
                }
                // 3b. 自彈自唱檢測
                if (titleLower.includes('自彈自唱')) {
                  classified.covers.push({
                    id: vid,
                    title: `【Cover】${title}`,
                    date: date
                  });
                  return;
                }
              }

              // ═══ STEP 4：檢測短片（≤60秒）═══
              if (detail.duration <= 60 && detail.duration > 0) {
                classified.shorts.push({
                  id: vid,
                  title: title,
                  date: date,
                  duration: detail.duration
                });
                return;
              }

              // ═══ STEP 5：未分類影片 ═══
              classified.unclassified.push({
                id: vid,
                title: title,
                date: date
              });
            });

            return classified;
          }

          // 函數：用搜尋 API 取得影片（備用方案）
          function fetchViaSearchAPI(vId, channelId) {
            return new Promise(async (resolve) => {
              const allItems = [];
              let pageToken = null;
              let pageCount = 0;
              const maxPages = 1;

              const options = {
                headers: {
                  'Referer': 'https://shiukonata.github.io/MCStudio/'
                }
              };

              const fetchPage = () => {
                let searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${channelId}&type=video&maxResults=30&order=date&key=${API_KEY}`;
                if (pageToken) {
                  searchUrl += `&pageToken=${pageToken}`;
                }

                https.get(searchUrl, options, (res) => {
                  let data = '';
                  res.on('data', chunk => data += chunk);
                  res.on('end', async () => {
                    try {
                      const result = JSON.parse(data);
                      if (result.error) {
                        console.log(`  └─ 搜尋API失敗: ${result.error.message}`);
                        resolve(classifyVideos(vId, allItems, {}));
                        return;
                      }

                      if (result.items) {
                        allItems.push(...result.items);
                      }

                      pageToken = result.nextPageToken;
                      pageCount++;

                      if (pageToken && pageCount < maxPages) {
                        fetchPage();
                      } else {
                        // 【FIXED】獲取影片詳情
                        const videoIds = allItems.map(item => item.id.videoId).filter(Boolean);
                        const videoDetails = await fetchVideoDetails(videoIds);
                        const videos = classifyVideos(vId, allItems, videoDetails);
                        console.log(`  └─ 搜尋API成功: 找到 ${videos.covers.length} Cover + ${videos.originals.length} Original + ${videos.shorts.length} Shorts + ${videos.unclassified.length} 未分類`);
                        resolve(videos);
                      }
                    } catch (e) {
                      console.log(`  └─ 搜尋API解析失敗`);
                      resolve(classifyVideos(vId, allItems, {}));
                    }
                  });
                }).on('error', (e) => {
                  console.log(`  └─ 搜尋API網路錯誤`);
                  resolve(classifyVideos(vId, allItems, {}));
                });
              };

              fetchPage();
            });
          }

          // 輔助函數：抓取播放列表的所有影片 ID（處理分頁）
          function fetchPlaylistIds(playlistId) {
            return new Promise((resolve) => {
              const ids = new Set();
              const options = { headers: { 'Referer': 'https://shiukonata.github.io/MCStudio/' } };

              const fetchPage = (pageToken) => {
                let url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${playlistId}&maxResults=50&key=${API_KEY}`;
                if (pageToken) url += `&pageToken=${pageToken}`;
                https.get(url, options, (res) => {
                  let data = '';
                  res.on('data', chunk => data += chunk);
                  res.on('end', () => {
                    try {
                      const result = JSON.parse(data);
                      (result.items || []).forEach(item => {
                        const vid = item.snippet.resourceId && item.snippet.resourceId.videoId;
                        if (vid) ids.add(vid);
                      });
                      if (result.nextPageToken) {
                        fetchPage(result.nextPageToken);
                      } else {
                        resolve(ids);
                      }
                    } catch (e) {
                      resolve(ids);
                    }
                  });
                }).on('error', () => resolve(ids));
              };
              fetchPage(null);
            });
          }

          // ──【FIXED】──函數：抓取並分類影片（完整五步）──
          async function fetchAndClassifyVideos(vId, channelId) {
            const uploadsId = 'UU' + channelId.substring(2);
            const shortsId  = 'UUSH' + channelId.substring(2);

            // 先抓 UUSH ID Set（Step 1 需要排除）
            const uushIds = await fetchPlaylistIds(shortsId);
            console.log(`  📋 ${vId}: UUSH 共 ${uushIds.size} 部 Shorts（將在 Step 1 排除）`);

            return new Promise((resolve) => {
              const playlistUrl = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${uploadsId}&maxResults=50&key=${API_KEY}`;

              const options = {
                headers: {
                  'Referer': 'https://shiukonata.github.io/MCStudio/'
                }
              };

              https.get(playlistUrl, options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', async () => {
                  try {
                    const result = JSON.parse(data);
                    if (result.error) {
                      console.log(`⚠️ ${vId}: 播放清單API失敗 - ${result.error.message}`);
                      console.log(`  └─ 嘗試用搜尋API...`);
                      const videos = await fetchViaSearchAPI(vId, channelId);
                      resolve(videos);
                      return;
                    }

                    // 【FIXED】獲取影片詳情
                    const videoIds = (result.items || [])
                      .map(item => item.snippet.resourceId && item.snippet.resourceId.videoId)
                      .filter(Boolean);

                    console.log(`  📋 ${vId}: 獲取 ${videoIds.length} 部影片的詳情...`);
                    const videoDetails = await fetchVideoDetails(videoIds);

                    const videos = classifyVideos(vId, result.items, videoDetails, uushIds);
                    const totalCount = videos.covers.length + videos.originals.length + videos.shorts.length + videos.unclassified.length;
                    console.log(`✅ ${vId}: 找到 ${videos.covers.length} Cover + ${videos.originals.length} Original + ${videos.shorts.length} Shorts + ${videos.unclassified.length} 未分類（共 ${totalCount} 部）`);
                    resolve(videos);
                  } catch (e) {
                    console.log(`⚠️ ${vId}: 播放清單API解析失敗`);
                    console.log(`  └─ 嘗試用搜尋API...`);
                    const videos = await fetchViaSearchAPI(vId, channelId);
                    resolve(videos);
                  }
                });
              }).on('error', async (e) => {
                console.log(`⚠️ ${vId}: 播放清單API網路錯誤`);
                console.log(`  └─ 嘗試用搜尋API...`);
                const videos = await fetchViaSearchAPI(vId, channelId);
                resolve(videos);
              });
            });
          }

          // ──【FIXED】──輔助函數：從 data.js 中提取現有影片 ID──
          function extractExistingVideoIds(vId) {
            const existingIds = new Set();
            const escaped = vId.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            // 找到該 VTuber 的區段（從 id:"vId" 到下一個頂層 { id: 或陣列結尾）
            const sectionMatch = dataContent.match(
              new RegExp(`id:\\s*["']${escaped}["'][\\s\\S]*?(?=\\n  \\{\\n    id:|\\n\\];)`)
            );
            if (!sectionMatch) return existingIds;
            const section = sectionMatch[0];
            // 用 regex 提取所有 {id:"..."} 格式的影片 ID
            const idPattern = /\{\s*id:\s*["']([^"']+)["']/g;
            let m;
            while ((m = idPattern.exec(section)) !== null) {
              existingIds.add(m[1]);
            }
            return existingIds;
          }

          // 順序執行（避免API限流）
          (async () => {
            let updateCount = 0;

            for (const vId of Object.keys(vtuberData)) {
              const videos = await fetchAndClassifyVideos(vId, vtuberData[vId].channelId);

              // ──【FIXED】──去重與增量更新邏輯──
              const existingIds = extractExistingVideoIds(vId);

              // 過濾掉已有的影片
              const newVideos = {
                covers: videos.covers.filter(v => !existingIds.has(v.id)),
                originals: videos.originals.filter(v => !existingIds.has(v.id)),
                officials: videos.officials.filter(v => !existingIds.has(v.id)),
                shorts: videos.shorts.filter(v => !existingIds.has(v.id)),
                unclassified: videos.unclassified.filter(v => !existingIds.has(v.id))
              };

              const hasNewVideos = newVideos.covers.length > 0
                || newVideos.originals.length > 0
                || newVideos.officials.length > 0
                || newVideos.shorts.length > 0
                || newVideos.unclassified.length > 0;

              if (hasNewVideos) {
                const escaped = vId.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                let addedCount = 0;

                // covers + originals → 插入 videos: [...] 陣列開頭
                const newVideoItems = [...newVideos.covers, ...newVideos.originals];
                if (newVideoItems.length > 0) {
                  const entries = newVideoItems.map(v => {
                    const safeTitle = v.title.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\r?\n/g, ' ');
                    return `      {id:"${v.id}",title:"${safeTitle}",date:"${v.date}"}`;
                  }).join(',\n') + ',';
                  const pat = new RegExp(`(id:\\s*["']${escaped}["'][\\s\\S]*?videos:\\s*\\[)`);
                  if (pat.test(dataContent)) {
                    dataContent = dataContent.replace(pat, `$1\n${entries}`);
                    addedCount += newVideoItems.length;
                  }
                }

                // shorts → 插入 shorts: [...] 陣列開頭
                if (newVideos.shorts.length > 0) {
                  const entries = newVideos.shorts.map(v => {
                    const safeTitle = v.title.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\r?\n/g, ' ');
                    return `      {id:"${v.id}",title:"${safeTitle}",date:"${v.date}"}`;
                  }).join(',\n') + ',';
                  const pat = new RegExp(`(id:\\s*["']${escaped}["'][\\s\\S]*?shorts:\\s*\\[)`);
                  if (pat.test(dataContent)) {
                    dataContent = dataContent.replace(pat, `$1\n${entries}`);
                    addedCount += newVideos.shorts.length;
                  }
                }

                if (addedCount > 0) {
                  updateCount += addedCount;
                  console.log(`  ✓ 已添加 ${newVideos.covers.length} Cover + ${newVideos.originals.length} Original + ${newVideos.shorts.length} Shorts`);
                } else {
                  console.log(`  ✗ 未找到 ${vId} 的陣列欄位，跳過`);
                }
              } else {
                console.log(`  ⊘ 無新影片需要更新`);
              }

              // 延遲避免API限流
              await new Promise(r => setTimeout(r, 500));
            }

            console.log(`\n📊 總計新增: ${updateCount} 部影片\n`);

            // 如果有更新，語法驗證後寫回data.js並commit
            if (updateCount > 0) {
              try {
                new (require('vm').Script)(dataContent);
              } catch (e) {
                console.log('❌ data.js 語法驗證失敗，中止寫入: ' + e.message);
                process.exit(1);
              }
              fs.writeFileSync(dataPath, dataContent, 'utf8');
              console.log('✅ data.js 語法驗證通過並已更新');
              process.exit(0);
            } else {
              console.log('⚠️ 沒有新影片需要更新');
              process.exit(0);
            }
          })();
          SCRIPT

      - name: 📝 Commit and push
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Auto-Update Bot"
          git add js/data.js

          if ! git diff --quiet --cached; then
            git commit -m "Auto-update: Add new VTuber videos ($(date -u +'%Y-%m-%d %H:%M UTC'))"

            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
            git push origin main
            echo "✅ 已推送到GitHub"
          else
            echo "⚠️ 沒有改動需要提交"
          fi

      - name: 📊 Log summary
        if: always()
        run: |
          echo "====== Auto-Update Complete ======"
          git log --oneline -5
