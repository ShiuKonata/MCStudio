name: 🎵 Auto-Update VTuber Videos

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 🎯 Run auto-update script
        id: update
        run: |
          node - <<'SCRIPT'
          const fs = require('fs');
          const https = require('https');

          const dataPath = './js/data.js';
          let dataContent = '';
          
          try {
            dataContent = fs.readFileSync(dataPath, 'utf8');
          } catch (e) {
            console.log('❌ 讀取 data.js 失敗');
            process.exit(1);
          }

          const apiKeyMatch = dataContent.match(/ytApiKey:\s*["']([^"']+)["']/);
          const API_KEY = apiKeyMatch ? apiKeyMatch[1] : null;

          if (!API_KEY) {
            console.log('❌ 無 API 金鑰');
            process.exit(1);
          }

          // ⚠️ 臨時測試模式：只掃描 ShiuCoda（節省 API 配額）
          // 確認工作正常後改回完整時段邏輯
          const vtuberIds = ['shiucoda'];
          console.log(`🔬 測試模式：只掃描 ShiuCoda\n`);

          const vtuberData = {};
          vtuberIds.forEach(id => {
            // 方法 1: 用簡單的字符串搜索定位該 VTuber
            const idStr = `id: "${id}"`;
            const idIndex = dataContent.indexOf(idStr);

            if (idIndex === -1) {
              console.log(`❌ 找不到 ${id} (搜尋: '${idStr}')`);
              return;
            }

            // 方法 2: 在該位置之後搜尋 youtubeChannelId
            const searchStart = idIndex;
            const searchEnd = searchStart + 3000;  // 往後搜尋 3000 字
            const searchText = dataContent.substring(searchStart, searchEnd);

            const channelMatch = searchText.match(/youtubeChannelId:\s*["']([^"']+)["']/);
            if (channelMatch) {
              vtuberData[id] = { channelId: channelMatch[1] };
              console.log(`✅ 找到 ${id}: ${channelMatch[1]}`);
            } else {
              console.log(`❌ 在 ${id} 之後找不到 youtubeChannelId`);
              console.log(`   搜尋文本: ${searchText.substring(0, 200)}...`);
            }
          });

          if (Object.keys(vtuberData).length === 0) {
            console.log(`❌ 無法獲取任何 VTuber 的頻道 ID\n`);
            process.exit(1);
          }
          console.log('');

          function classifyVideos(vId, items) {
            const covers = [], originals = [], unclassified = [];
            if (!items || items.length === 0) {
              console.log(`  ⚠️  ${vId}: 無影片資料`);
              return { covers, originals, unclassified };
            }

            console.log(`  📊 ${vId}: 掃描 ${items.length} 部影片`);
            let skipped = 0;

            items.forEach((item, idx) => {
              const title = item.snippet?.title || '';
              const vid = item.snippet?.resourceId?.videoId;
              const date = item.snippet?.publishedAt?.substring(0, 10) || '';

              if (!vid || !date) {
                console.log(`    ⚠️  [${idx}] 遺漏資料: vid=${vid}, date=${date}, title=${title}`);
                return;
              }

              // 檢查是否已存在
              if (dataContent.includes(`"${vid}"`) || dataContent.includes(`'${vid}'`)) {
                skipped++;
                console.log(`    ⊘ [${idx}] ${date} - 已存在: ${title.substring(0, 40)}`);
                return;
              }

              const tL = title.toLowerCase();

              // STEP 1：排除直播
              if (tL.includes('直播') || tL.includes('archive') || tL.includes('livestream')) {
                console.log(`    🚫 [${idx}] ${date} - 直播已排除: ${title.substring(0, 40)}`);
                return;
              }

              // STEP 2-3：分類
              let classified = false;

              if (tL.includes('cover') || tL.includes('歌ってみた')) {
                covers.push({ id: vid, title: `【Cover】${title}`, date });
                console.log(`    ✅ [${idx}] ${date} - Cover: ${title.substring(0, 40)}`);
                classified = true;
              } else if (tL.includes('original') || tL.includes('official') || tL.includes('原創')) {
                originals.push({ id: vid, title: `【Original】${title}`, date });
                console.log(`    ✅ [${idx}] ${date} - Original: ${title.substring(0, 40)}`);
                classified = true;
              } else if (vId === 'shiucoda' && (tL.includes('demo') || tL.includes('自彈自唱'))) {
                covers.push({ id: vid, title: `【Cover】${title}`, date });
                console.log(`    ✅ [${idx}] ${date} - Cover (特殊規則): ${title.substring(0, 40)}`);
                classified = true;
              }

              if (!classified) {
                unclassified.push({ id: vid, title, date });
                console.log(`    ❓ [${idx}] ${date} - 未分類: ${title.substring(0, 40)}`);
              }
            });

            const found = covers.length + originals.length + unclassified.length;
            console.log(`    📈 ${vId}: 新增 ${found} 部, 跳過 ${skipped} 部`);
            return { covers, originals, unclassified };
          }

          async function fetchPlaylistVideoIds(playlistId) {
            return new Promise((resolve) => {
              const videoIds = new Set();
              const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${playlistId}&maxResults=10&key=${API_KEY}`;

              https.get(url, { headers: { 'Referer': 'https://shiukonata.github.io/MCStudio/' } }, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    const result = JSON.parse(data);
                    if (result.items && Array.isArray(result.items)) {
                      result.items.forEach(item => {
                        const vid = item.snippet?.resourceId?.videoId;
                        if (vid) videoIds.add(vid);
                      });
                    }
                    resolve(videoIds);
                  } catch (e) {
                    resolve(videoIds);
                  }
                });
              }).on('error', () => resolve(videoIds));
            });
          }

          function fetchVideos(vId, channelId) {
            return new Promise(async (resolve) => {
              try {
                const baseId = channelId.substring(2);
                const uploadsId = 'UU' + baseId;
                const uulvId = 'UULV' + baseId;      // 直播存檔播放列表
                const uushId = 'UUSH' + baseId;      // Shorts 播放列表

                console.log(`📥 ${vId}: 抓取 ${uploadsId}`);
                console.log(`  ⊘ 排除清單: ${uulvId} (直播存檔) + ${uushId} (Shorts)`);

                // 先抓取要排除的視頻 ID
                console.log(`  🔄 讀取 UULV 播放列表...`);
                const uulvVideos = await fetchPlaylistVideoIds(uulvId);
                console.log(`  🔄 讀取 UUSH 播放列表...`);
                const uushVideos = await fetchPlaylistVideoIds(uushId);
                console.log(`  ⊘ 排除 ${uulvVideos.size} 部直播 + ${uushVideos.size} 部 Shorts\n`);

                const excludeSet = new Set([...uulvVideos, ...uushVideos]);

                const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${uploadsId}&maxResults=10&key=${API_KEY}`;

              https.get(url, { headers: { 'Referer': 'https://shiukonata.github.io/MCStudio/' } }, (res) => {
                // 檢查 HTTP 狀態碼
                if (res.statusCode !== 200) {
                  console.log(`❌ ${vId}: HTTP ${res.statusCode}`);
                  resolve({ covers: [], originals: [], unclassified: [] });
                  return;
                }

                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    const result = JSON.parse(data);

                    // 檢查 API 錯誤
                    if (result.error) {
                      const msg = result.error.message || JSON.stringify(result.error);
                      console.log(`❌ ${vId}: API 錯誤 - ${msg}`);
                      resolve({ covers: [], originals: [], unclassified: [] });
                      return;
                    }

                    // 檢查是否有影片資料
                    if (!result.items || !Array.isArray(result.items)) {
                      console.log(`⚠️ ${vId}: 無影片資料`);
                      resolve({ covers: [], originals: [], unclassified: [] });
                      return;
                    }

                    // 過濾掉 UULV 和 UUSH 中的視頻
                    const filteredItems = result.items.filter(item => {
                      const vid = item.snippet?.resourceId?.videoId;
                      return !excludeSet.has(vid);
                    });

                    console.log(`  📬 ${vId}: API 返回 ${result.items.length} 部影片，過濾後 ${filteredItems.length} 部`);
                    const videos = classifyVideos(vId, filteredItems);
                    const total = videos.covers.length + videos.originals.length + videos.unclassified.length;
                    console.log(`✅ ${vId}: 新增 ${total} 部影片\n`);
                    resolve(videos);
                  } catch (e) {
                    console.log(`❌ ${vId}: JSON 解析失敗 - ${e.message}`);
                    resolve({ covers: [], originals: [], unclassified: [] });
                  }
                });
              }).on('error', (err) => {
                console.log(`❌ ${vId}: 網路錯誤 - ${err.message}`);
                resolve({ covers: [], originals: [], unclassified: [] });
              });
              } catch (err) {
                console.log(`❌ ${vId}: 致命錯誤 - ${err.message}`);
                resolve({ covers: [], originals: [], unclassified: [] });
              }
            });
          }

          (async () => {
            console.log('\n════════════════════════════════════════\n');
            let allCovers = 0, allOriginals = 0, allUnclassified = 0;
            const allNewVideos = {};  // 收集所有新視頻

            for (const vId of Object.keys(vtuberData)) {
              const v = await fetchVideos(vId, vtuberData[vId].channelId);
              allCovers += v.covers.length;
              allOriginals += v.originals.length;
              allUnclassified += v.unclassified.length;

              // 保存新視頻
              if (v.covers.length > 0 || v.originals.length > 0 || v.unclassified.length > 0) {
                allNewVideos[vId] = v;
              }

              await new Promise(r => setTimeout(r, 300));
            }

            const total = allCovers + allOriginals + allUnclassified;
            console.log('\n════════════════════════════════════════');
            console.log(`📊 掃描統計結果：`);
            console.log(`  ✅ Cover: ${allCovers} 部`);
            console.log(`  ✅ Original: ${allOriginals} 部`);
            console.log(`  ❓ 未分類: ${allUnclassified} 部`);
            console.log(`  📈 合計: ${total} 部新影片（客戶端自動分類）`);
            console.log('════════════════════════════════════════\n');

            // 如果有新視頻，自動更新 data.js
            if (total > 0) {
              console.log('💾 正在更新 data.js...\n');

              let updated = dataContent;
              let updateCount = 0;

              for (const vId of Object.keys(allNewVideos)) {
                const videos = allNewVideos[vId];

                // ShiuCoda 特殊處理（使用 videos 陣列）
                if (vId === 'shiucoda') {
                  if (videos.covers.length > 0) {
                    // 直接查找並替換：找到 'videos: [' 的下一行
                    const searchStr = 'id: "shiucoda"';
                    const videosStr = 'videos: [';
                    const startIdx = updated.indexOf(searchStr);

                    if (startIdx !== -1) {
                      const videosIdx = updated.indexOf(videosStr, startIdx);
                      const arrayStart = updated.indexOf('[', videosIdx);

                      if (arrayStart !== -1) {
                        // 在 '[' 後面的換行後插入新視頻
                        const insertIdx = arrayStart + 1;

                        // 構造新視頻行
                        const v = videos.covers[0];
                        const newLine = `\n      { id: "${v.id}", title: "${v.title.replace(/"/g, '\\"')}", date: "${v.date}" },`;

                        updated = updated.substring(0, insertIdx) + newLine + updated.substring(insertIdx);
                        console.log(`  ✅ shiucoda: 添加 1 部 Cover (ID: ${v.id})`);
                        updateCount++;
                      } else {
                        console.log(`  ❌ shiucoda: 找不到 videos 陣列開始`);
                      }
                    } else {
                      console.log(`  ❌ shiucoda: 找不到 ShiuCoda 的 id`);
                    }
                  }
                }
                // TODO: 其他 26 位 VTuber 的處理（待實裝）
              }

              // 寫入更新後的 data.js（只負責寫入，Git 操作由 GitHub Actions 步驟處理）
              if (updateCount > 0) {
                try {
                  fs.writeFileSync(dataPath, updated, 'utf8');
                  console.log(`✅ data.js 已成功寫入！\n`);
                  console.log(`📝 檔案更新詳情：`);
                  console.log(`  - 新增 VTuber: ${Object.keys(allNewVideos).length} 位`);
                  console.log(`  - 新增視頻總數: ${updateCount} 部`);
                  console.log(`\n⏭️ 接下來由 GitHub Actions 步驟負責 commit 和 push\n`);
                } catch (err) {
                  console.log(`❌ 寫入 data.js 失敗: ${err.message}\n`);
                  process.exit(1);
                }
              } else {
                console.log(`\n⚠️ 沒有成功更新任何 VTuber\n`);
              }
            } else {
              console.log('📭 沒有新視頻，無需更新 data.js\n');
            }

            process.exit(0);
          })();
          SCRIPT

      - name: 📋 Check for changes
        id: check
        run: |
          if git diff --quiet js/data.js; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✅ data.js 無變更"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ data.js 有新變更，準備提交"
          fi

      - name: 📝 Commit and Push
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Auto-Update Bot"
          git add js/data.js
          git commit -m "Auto-update: Add new ShiuCoda videos from YouTube API"
          git push
          echo "✅ 成功推送到 GitHub"

      - name: 📊 Summary
        if: always()
        run: |
          echo "🎯 Workflow 執行完成"
          echo "---"
          git log --oneline -3
