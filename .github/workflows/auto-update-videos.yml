name: 🎵 Auto-Update VTuber Videos

on:
  schedule:
    # 【新設計】每天 UTC 00:00 執行一次（24小時輪流更新所有VTuber）
    - cron: '0 0 * * *'
  # 允許手動觸發
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 🎯 Run auto-update script
        run: |
          node - <<'SCRIPT'
          const fs = require('fs');
          const https = require('https');

          const dataPath = './js/data.js';

          // 讀取 data.js
          let dataContent = '';
          try {
            dataContent = fs.readFileSync(dataPath, 'utf8');
          } catch (e) {
            console.log('❌ 讀取 data.js 失敗: ' + e.message);
            process.exit(1);
          }

          // 從 data.js 中提取 API 金鑰
          const apiKeyMatch = dataContent.match(/ytApiKey:\s*["']([^"']+)["']/);
          const API_KEY = apiKeyMatch ? apiKeyMatch[1] : null;

          if (!API_KEY) {
            console.log('❌ 無法從 data.js 中找到 API 金鑰');
            process.exit(1);
          }
          console.log('✅ 已從 data.js 讀取 API 金鑰\n');

          // 【新設計】每天 UTC 00:00 執行一次，根據日期輪流更新 4 組 VTuber（每天更新全部27位）
          // 但分成4組，確保配額合理分配
          const now = new Date();
          const dayOfYear = Math.floor((now - new Date(now.getUTCFullYear(), 0, 0)) / 86400000);
          const segmentIndex = dayOfYear % 4;

          let vtuberIds = [];
          let currentSegment = 0;

          // 定義4個時段的 VTuber（按世代順序）
          const segments = [
            {
              // 【時段 1】一期生 + 零期生 + 二期生前半
              ids: ['shiucoda', 'rumi', 'paroniie', 'lubee', 'himegimichika', 'arrynia', 'kiriko'],
              name: '時段1（一期+零期+二期前）'
            },
            {
              // 【時段 2】二期生後半 + 三期生前半
              ids: ['vaswawa', 'sinniearis', 'ririna', 'ekorru', 'wakasaito', 'whalefall', 'kai'],
              name: '時段2（二期後+三期前）'
            },
            {
              // 【時段 3】三期生後半 + 四期生
              ids: ['mukuru', 'nyrfier', 'shiroleon', 'fuka22', 'BarkBarkPomi', 'cocor0', 'UchiFifi'],
              name: '時段3（三期後+四期）'
            },
            {
              // 【時段 4】五期生 + 六期生
              ids: ['chita', 'nokori', 'KeKeMii', 'chamamatti', 'Pele', 'Yawnii'],
              name: '時段4（五期+六期）'
            }
          ];

          vtuberIds = segments[segmentIndex].ids;
          currentSegment = segmentIndex + 1;

          console.log(`🚀 【每日輪流更新】${segments[segmentIndex].name}`);
          console.log(`   今天更新 ${vtuberIds.length} 位 VTuber\n`);

          const originalContent = dataContent;

          // 從data.js中提取VTuber資訊
          const vtuberData = {};
          vtuberIds.forEach(id => {
            // 改進的正則：允許更多字符在id和youtubeChannelId之間
            const match = dataContent.match(new RegExp(`id:\\s*["']${id}["'][\\s\\S]*?youtubeChannelId:\\s*["']([^"']+)["']`, 'm'));
            if (match) {
              vtuberData[id] = { channelId: match[1] };
            }
          });

          console.log(`✅ 找到 ${Object.keys(vtuberData).length} 位VTuber的頻道ID\n`);

          // 輔助函數：分類影片（新結構：covers/originals/officials/unclassified）
          function classifyVideos(vId, items) {
            const classified = {
              covers: [],
              originals: [],
              officials: [],
              unclassified: []
            };
            if (!items) return classified;

            items.forEach(item => {
              const title = item.snippet.title;
              const vid = item.snippet.resourceId ? item.snippet.resourceId.videoId : item.id?.videoId;
              const date = item.snippet.publishedAt ? item.snippet.publishedAt.substring(0, 10) : '';
              if (!vid) return;

              const titleLower = title.toLowerCase();

              // STEP 2-4 自動分類
              if (titleLower.includes('cover') || titleLower.includes('歌ってみた')) {
                // STEP 2: Cover 檢測
                classified.covers.push({
                  id: vid,
                  title: `【Cover】${title}`,
                  date: date
                });
              } else if (titleLower.includes('original') || titleLower.includes('official') || titleLower.includes('原創')) {
                // STEP 2: Original 檢測
                classified.originals.push({
                  id: vid,
                  title: `【Original】${title}`,
                  date: date
                });
              } else {
                // 未分類影片（等待 STEP 5 手動分配）
                classified.unclassified.push({
                  id: vid,
                  title: title,
                  date: date
                });
              }
            });
            return classified;
          }

          // 函數：用搜尋 API 取得影片（備用方案，限制為最新影片）
          function fetchViaSearchAPI(vId, channelId) {
            return new Promise(async (resolve) => {
              const allItems = [];
              let pageToken = null;
              let pageCount = 0;
              const maxPages = 1; // 只取第一頁（最新 10 部），減少配額消耗

              const options = {
                headers: {
                  'Referer': 'https://shiukonata.github.io/MCStudio/'
                }
              };

              const fetchPage = () => {
                // maxResults=30 取得更多最新影片
                let searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${channelId}&type=video&maxResults=30&order=date&key=${API_KEY}`;
                if (pageToken) {
                  searchUrl += `&pageToken=${pageToken}`;
                }

                https.get(searchUrl, options, (res) => {
                  let data = '';
                  res.on('data', chunk => data += chunk);
                  res.on('end', () => {
                    try {
                      const result = JSON.parse(data);
                      if (result.error) {
                        console.log(`  └─ 搜尋API失敗: ${result.error.message}`);
                        resolve(classifyVideos(vId, allItems));
                        return;
                      }

                      if (result.items) {
                        allItems.push(...result.items);
                      }

                      pageToken = result.nextPageToken;
                      pageCount++;

                      // 如果有下一頁且未達上限，繼續取
                      if (pageToken && pageCount < maxPages) {
                        fetchPage();
                      } else {
                        const videos = classifyVideos(vId, allItems);
                        console.log(`  └─ 搜尋API成功: 找到 ${videos.length} 部影片 (${pageCount} 頁)`);
                        resolve(videos);
                      }
                    } catch (e) {
                      console.log(`  └─ 搜尋API解析失敗`);
                      resolve(classifyVideos(vId, allItems));
                    }
                  });
                }).on('error', (e) => {
                  console.log(`  └─ 搜尋API網路錯誤`);
                  resolve(classifyVideos(vId, allItems));
                });
              };

              fetchPage();
            });
          }

          // 函數：抓取並分類影片（優先播放清單 API，備用搜尋 API）
          // 【新設計】maxResults=30 用來取得更多最新影片
          async function fetchAndClassifyVideos(vId, channelId) {
            return new Promise((resolve) => {
              const uploadsId = 'UU' + channelId.substring(2);
              const playlistUrl = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${uploadsId}&maxResults=30&key=${API_KEY}`;

              const options = {
                headers: {
                  'Referer': 'https://shiukonata.github.io/MCStudio/'
                }
              };

              https.get(playlistUrl, options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', async () => {
                  try {
                    const result = JSON.parse(data);
                    if (result.error) {
                      console.log(`⚠️ ${vId}: 播放清單API失敗 - ${result.error.message}`);
                      console.log(`  └─ 嘗試用搜尋API...`);
                      const videos = await fetchViaSearchAPI(vId, channelId);
                      resolve(videos);
                      return;
                    }

                    const videos = classifyVideos(vId, result.items);
                    console.log(`✅ ${vId}: 找到 ${videos.length} 部影片`);
                    resolve(videos);
                  } catch (e) {
                    console.log(`⚠️ ${vId}: 播放清單API解析失敗`);
                    console.log(`  └─ 嘗試用搜尋API...`);
                    const videos = await fetchViaSearchAPI(vId, channelId);
                    resolve(videos);
                  }
                });
              }).on('error', async (e) => {
                console.log(`⚠️ ${vId}: 播放清單API網路錯誤`);
                console.log(`  └─ 嘗試用搜尋API...`);
                const videos = await fetchViaSearchAPI(vId, channelId);
                resolve(videos);
              });
            });
          }

          // 順序執行（避免API限流）
          (async () => {
            let updateCount = 0;

            for (const vId of Object.keys(vtuberData)) {
              const videos = await fetchAndClassifyVideos(vId, vtuberData[vId].channelId);

              // 【新結構】檢查是否有新影片（任何陣列非空）
              if (videos.covers.length > 0 || videos.originals.length > 0 || videos.unclassified.length > 0) {
                // 構建新的videos JSON（新結構：{ covers: [], originals: [], officials: [], unclassified: [] }）
                const videosJson = JSON.stringify(videos, null, 2);

                // 替換該VTuber的videos欄位（相容舊的 [] 和新的 {} 結構）
                const pattern = new RegExp(`(id:\\s*["']${vId}["'][\\s\\S]*?videos:\\s*)(\\{[\\s\\S]*?\\}|\\[\\])`, 's');
                if (pattern.test(dataContent)) {
                  dataContent = dataContent.replace(pattern, `$1${videosJson}`);
                  const totalCount = videos.covers.length + videos.originals.length + videos.unclassified.length;
                  updateCount += totalCount;
                  console.log(`  ✓ 已更新 ${videos.covers.length} Cover + ${videos.originals.length} Original + ${videos.unclassified.length} 未分類`);
                } else {
                  console.log(`  ✗ 未找到 ${vId} 的videos欄位，跳過`);
                }
              }

              // 延遲避免API限流
              await new Promise(r => setTimeout(r, 500));
            }

            console.log(`\n📊 總計更新: ${updateCount} 部影片\n`);

            // 如果有更新，寫回data.js並commit
            if (updateCount > 0) {
              fs.writeFileSync(dataPath, dataContent, 'utf8');
              console.log('✅ data.js 已更新');
              process.exit(0);
            } else {
              console.log('⚠️ 沒有新影片需要更新');
              process.exit(0);
            }
          })();
          SCRIPT

      - name: 📝 Commit and push
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Auto-Update Bot"
          git add js/data.js

          # 只有在有改動時才commit
          if ! git diff --quiet --cached; then
            git commit -m "Auto-update: Add new VTuber videos ($(date -u +'%Y-%m-%d %H:%M UTC'))"

            # 使用 GITHUB_TOKEN 推送
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
            git push origin main
            echo "✅ 已推送到GitHub"
          else
            echo "⚠️ 沒有改動需要提交"
          fi

      - name: 📊 Log summary
        if: always()
        run: |
          echo "====== Auto-Update Complete ======"
          git log --oneline -5
